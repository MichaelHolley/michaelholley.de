version: 2
updates:
  # ---- npm (pnpm) ----
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '00:00'
      timezone: 'Etc/UTC'
    # stay within the package.json semver ranges, so majors are never proposed
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      npm:
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  # ---- GitHub Actions ----
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '00:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'

  # ---- Docker base image ----
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '00:00'
      timezone: 'Etc/UTC'
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # keep Node major in lockstep with CI's node-version: 24 (bump manually)
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
